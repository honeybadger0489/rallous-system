plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = 'rallous-recruits-bridge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty('java.version')}"
println "Forge: ${minecraft_version}-${forge_version}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    maven { url = 'https://www.cursemaven.com' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

def recruitsJar = file('libs/recruits-1.20.1-1.15.2.jar')

tasks.register('downloadRecruits') {
    outputs.file recruitsJar
    doLast {
        recruitsJar.parentFile.mkdirs()
        if (recruitsJar.exists() && recruitsJar.length() > 1_000_000) {
            return
        }
        def url = 'https://cdn.modrinth.com/data/WOg9lm4u/versions/2zXpVxK4/recruits-1.20.1-1.15.2.jar'
        logger.lifecycle("Downloading Recruits 1.15.2 (pack fileID 8339846) from Modrinth")
        new URL(url).withInputStream { ins ->
            recruitsJar.withOutputStream { it << ins }
        }
        if (recruitsJar.length() < 1_000_000) {
            throw new GradleException("Recruits jar download looks truncated: ${recruitsJar.length()} bytes")
        }
    }
}

tasks.named('compileJava', JavaCompile).configure {
    dependsOn tasks.named('downloadRecruits')
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    compileOnly files(recruitsJar)
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
